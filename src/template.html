<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyon par cœur</title>
<meta name="description" content="Learn the streets and arrondissements of Lyon: find streets on a blank map, name highlighted streets, tap districts, with an optional timer.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231d3a5c'/%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%23f4f7f8' stroke-width='1.5'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' text-anchor='middle' fill='%23f4f7f8'%3ELY%3C/text%3E%3C/svg%3E">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one framed instrument. Every region shares 1px hairlines, no gaps, no rounding.
   Wide: study panel left, map right. Narrow: map on top, panel below. */
:root {
  --bg: #e9edef;
  --panel: #fafbfb;
  --panel-2: #eef1f2;
  --ink: #172026;
  --muted: #5a6870;
  --line: #cfd7db;
  --map-bg: #f3f5f4;
  --arr-fill: #e6ebe8;
  --arr-focus: #fbfcfb;
  --arr-dim: #dde3e0;
  --arr-line: #a3aeb3;
  --arr-band: #dbe2de;
  --arr-label: #7f8b92;
  --street-major: #5b6870;
  --street: #a7b1b6;
  --street-ped: #98a3a8;
  --rhone: #94bddf;
  --saone: #9ac8bf;
  --accent: #b3261e;
  --accent-ink: #ffffff;
  --good: #2c7a4b;
  --good-soft: rgba(44, 122, 75, .22);
  --bad: #b3261e;
  --bad-soft: rgba(179, 38, 30, .18);
  --wrong-street: #c27a12;
  --pick: #6b3fd4;
  --plaque: #1d3a5c;
  --plaque-ink: #f4f7f8;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1417; --panel: #161d21; --panel-2: #1e272c; --ink: #e4eaed; --muted: #95a3aa; --line: #2a353b;
    --map-bg: #12181b; --arr-fill: #192125; --arr-focus: #1f292e; --arr-dim: #141b1e;
    --arr-line: #3d4a51; --arr-band: #1d272b; --arr-label: #64737b; --street-major: #83919a; --street: #3f4b51;
    --street-ped: #56636a; --rhone: #22405a; --saone: #224641; --accent: #f0645a; --accent-ink: #1a0d0c;
    --good: #5cc088; --good-soft: rgba(92, 192, 136, .22); --bad: #f0645a; --bad-soft: rgba(240, 100, 90, .2);
    --wrong-street: #e3a23b; --pick: #b49bff; --plaque: #24476f; --plaque-ink: #f4f7f8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1417; --panel: #161d21; --panel-2: #1e272c; --ink: #e4eaed; --muted: #95a3aa; --line: #2a353b;
  --map-bg: #12181b; --arr-fill: #192125; --arr-focus: #1f292e; --arr-dim: #141b1e;
  --arr-line: #3d4a51; --arr-band: #1d272b; --arr-label: #64737b; --street-major: #83919a; --street: #3f4b51;
  --street-ped: #56636a; --rhone: #22405a; --saone: #224641; --accent: #f0645a; --accent-ink: #1a0d0c;
  --good: #5cc088; --good-soft: rgba(92, 192, 136, .22); --bad: #f0645a; --bad-soft: rgba(240, 100, 90, .2);
  --wrong-street: #e3a23b; --pick: #b49bff; --plaque: #24476f; --plaque-ink: #f4f7f8;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  overflow: hidden;
}
.app {
  height: 100%; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.frame {
  height: 100%; box-sizing: border-box;
  display: grid; grid-template-rows: auto minmax(0, 1fr);
  border: 1px solid var(--line); background: var(--panel);
}
/* header: brand cell, then one cell per mode, all sharing hairlines */
.top { display: flex; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px; margin-right: auto; }
.brand b { font-family: var(--font-display); font-size: 1.45rem; font-weight: 700; letter-spacing: .01em; line-height: 1; }
.brand span { font: 500 .72rem var(--font-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.modes { display: flex; }
.modes button {
  font: 500 .74rem/1 var(--font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
  background: none; border: 0; border-left: 1px solid var(--line); border-radius: 0;
  padding: 0 22px; cursor: pointer;
}
.modes button:hover { color: var(--ink); background: var(--panel-2); }
.modes button[aria-selected="true"] { color: var(--ink); background: var(--panel-2); box-shadow: inset 0 -2px 0 var(--ink); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--rhone); outline-offset: -2px; }

.layout { min-height: 0; display: grid; grid-template-columns: 360px minmax(0, 1fr); }
.panel {
  min-width: 0; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--line);
}
.panel > section { border-bottom: 1px solid var(--line); }
.panel > section.mastery { border-bottom: 0; }

.settings { display: flex; }
.settings label {
  flex: 1 1 0; min-width: 0;
  display: flex; flex-direction: column; gap: 2px; padding: 10px 14px 8px;
  font: 500 .66rem var(--font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
}
.settings label:not([hidden]) ~ label:not([hidden]) { border-left: 1px solid var(--line); }
.timerbar { display: flex; }
.timerbar span, .timerbar button { font: 500 .7rem/1 var(--font-mono); letter-spacing: .07em; text-transform: uppercase; padding: 11px 0; }
.timerbar span { color: var(--muted); padding-left: 14px; padding-right: 14px; display: flex; align-items: center; }
.timerbar button { flex: 1 1 0; background: none; border: 0; border-left: 1px solid var(--line); border-radius: 0; color: var(--muted); cursor: pointer; }
.timerbar button:hover { color: var(--ink); background: var(--panel-2); }
.timerbar button[aria-pressed="true"] { color: var(--ink); background: var(--panel-2); box-shadow: inset 0 -2px 0 var(--ink); }
.clock { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; font: 500 .74rem var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.clock-track { height: 4px; background: var(--line); }
.clock-track i { display: block; height: 100%; width: 100%; background: var(--ink); }
.clock-track i.low { background: var(--accent); }
.clock span { min-width: 9ch; text-align: right; }
.clock.out span { color: var(--accent); }
.settings select {
  font: 500 .92rem var(--font-body); color: var(--ink); background: transparent;
  border: 0; border-radius: 0; padding: 2px 0; width: 100%; min-width: 0; cursor: pointer;
}
.settings select:hover { color: var(--ink); }
.settings select, .settings option { background: var(--panel); color: var(--ink); }
input[type="search"] {
  font: 500 .92rem var(--font-body); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 0; padding: 9px 10px; width: 100%; box-sizing: border-box; min-width: 0;
}

.card { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow {
  display: flex; justify-content: space-between; gap: 8px;
  font: 500 .68rem var(--font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.plaque { background: var(--plaque); color: var(--plaque-ink); padding: 4px; }
.plaque div {
  border: 1.5px solid color-mix(in srgb, var(--plaque-ink) 70%, transparent);
  padding: 10px 12px 8px;
  font-family: var(--font-display); font-weight: 600; font-size: 1.8rem; line-height: 1.05;
  text-align: center; text-wrap: balance; overflow-wrap: anywhere;
}
.hint { color: var(--muted); font-size: .88rem; margin: 0; }
.row { display: flex; gap: 0; flex-wrap: wrap; align-items: center; }
.btn {
  font: 500 .74rem/1 var(--font-mono); letter-spacing: .07em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 0; background: var(--panel); color: var(--ink);
  padding: 12px 16px; cursor: pointer;
}
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--ink) 86%, var(--panel)); }
.row .btn + .btn { border-left: 0; }
.btn.link {
  border: 0; background: none; padding: 4px 0; color: var(--muted);
  font: 400 .85rem var(--font-body); letter-spacing: 0; text-transform: none; text-decoration: underline;
}
.btn.link:hover { color: var(--ink); }

.options { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.options button {
  font: 500 .92rem/1.25 var(--font-body); text-align: left; color: var(--ink);
  padding: 10px 12px; min-height: 54px; overflow-wrap: anywhere;
  border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0;
  background: var(--panel); cursor: pointer;
}
.options button:hover:not(:disabled) { background: var(--panel-2); }
.options button b { display: block; font: 500 .64rem var(--font-mono); color: var(--muted); margin-bottom: 2px; }
.options button.good { background: var(--good-soft); box-shadow: inset 3px 0 0 var(--good); }
.options button.bad { background: var(--bad-soft); box-shadow: inset 3px 0 0 var(--bad); }
.options button:disabled { cursor: default; }

.result { display: grid; grid-template-columns: auto minmax(0, 1fr); border: 1px solid var(--line); }
.score {
  display: grid; place-items: center; min-width: 64px; padding: 10px 8px;
  border-right: 1px solid var(--line);
  font: 600 1.35rem/1 var(--font-mono); font-variant-numeric: tabular-nums;
}
.score.hi { background: var(--good-soft); color: var(--good); }
.score.mid { background: color-mix(in srgb, var(--wrong-street) 18%, transparent); color: var(--wrong-street); }
.score.lo { background: var(--bad-soft); color: var(--bad); }
.result p { margin: 0; padding: 10px 12px; min-width: 0; }
.result strong { font-size: 1rem; }

.tiers { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); font: 500 .66rem/1.3 var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tiers span { padding: 6px 8px; }
.tiers span + span { border-left: 1px solid var(--line); }
.tiers em { display: block; font-style: normal; color: var(--ink); font-size: .82rem; }

.mastery { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 8px; font-size: .82rem; color: var(--muted); }
.bar { height: 4px; background: var(--line); }
.bar i { display: block; height: 100%; background: var(--good); transition: width .4s; }

.review { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.review button {
  width: 100%; display: flex; justify-content: space-between; gap: 8px; text-align: left;
  font: 500 .9rem var(--font-body); background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
  padding: 8px 4px; color: var(--ink); cursor: pointer;
}
.review button:hover { background: var(--panel-2); }
.review button span:last-child { font-family: var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.info dl { display: grid; grid-template-columns: auto 1fr; margin: 0; font-size: .9rem; border-top: 1px solid var(--line); }
.info dt, .info dd { margin: 0; padding: 7px 4px; border-bottom: 1px solid var(--line); }
.info dt { font: 500 .68rem var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-right: 16px; align-self: stretch; display: flex; align-items: center; }

.credits {
  margin-top: auto; border-top: 1px solid var(--line);
  padding: 10px 16px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  font: 400 .66rem var(--font-mono); color: var(--muted);
}
.credits a { color: inherit; }
.credits button { font: inherit; background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; }
sup { font-size: .6em; }

.mapwrap { position: relative; min-width: 0; min-height: 0; background: var(--map-bg); }
#map { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
#map.pan { cursor: grab; }
.mapbtns {
  position: absolute; right: 0; bottom: 0; display: flex; flex-direction: column;
  border-left: 1px solid var(--line); border-top: 1px solid var(--line); background: var(--panel);
}
.mapbtns button {
  width: 40px; height: 40px; border: 0; border-radius: 0; background: var(--panel); color: var(--ink);
  font: 500 1.05rem/1 var(--font-mono); cursor: pointer; display: grid; place-items: center;
}
.mapbtns button + button { border-top: 1px solid var(--line); }
.mapbtns button:hover { background: var(--panel-2); }
.legend {
  position: absolute; left: 0; bottom: 0; display: flex;
  border-top: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--panel);
  font: 500 .66rem var(--font-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
}
.legend span { padding: 7px 10px; display: flex; align-items: center; gap: 6px; }
.legend span + span { border-left: 1px solid var(--line); }
.legend i { display: inline-block; width: 14px; height: 4px; }
.tip {
  position: absolute; pointer-events: none; z-index: 2;
  background: var(--ink); color: var(--panel); padding: 4px 8px;
  font: 500 .74rem var(--font-mono); white-space: nowrap; transform: translate(12px, -130%);
}

@media (max-width: 860px) {
  .app { padding-block: 8px; }
  .top { flex-wrap: wrap; }
  .brand { padding: 10px 12px; }
  .brand b { font-size: 1.25rem; }
  .modes { width: 100%; border-top: 1px solid var(--line); }
  .modes button { flex: 1 1 0; padding: 11px 0; font-size: .68rem; letter-spacing: .05em; }
  .modes button:first-child { border-left: 0; }
  .layout { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  .mapwrap { order: 1; }
  .panel { order: 2; max-height: 46vh; border-right: 0; border-top: 1px solid var(--line); }
  .card { padding: 12px; gap: 10px; }
  .plaque div { font-size: 1.45rem; padding: 7px 10px 6px; }
  .credits, .legend, .tip { display: none; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<div class="app"><div class="frame">
  <header class="top">
    <div class="brand"><b>Lyon par cœur</b><span id="brand-count"></span></div>
    <nav class="modes" role="tablist" aria-label="Mode">
      <button role="tab" id="m-find" data-mode="find">Find</button>
      <button role="tab" id="m-name" data-mode="name">Name</button>
      <button role="tab" id="m-district" data-mode="district">Districts</button>
      <button role="tab" id="m-explore" data-mode="explore">Explore</button>
    </nav>
  </header>
  <main class="layout">
    <div class="panel" aria-live="polite">
      <section class="settings" id="settings">
        <label for="f-arr">Area
          <select id="f-arr"></select>
        </label>
        <label for="f-level">Streets
          <select id="f-level">
            <option value="1">Main roads</option>
            <option value="2">+ Well-known streets</option>
            <option value="3">Every street</option>
          </select>
        </label>
      </section>
      <section class="timerbar" id="timerbar" role="group" aria-label="Timer">
        <span>Timer</span>
        <button type="button" data-t="0">Off</button>
        <button type="button" data-t="30">30 s</button>
        <button type="button" data-t="15">15 s</button>
        <button type="button" data-t="5">5 s</button>
      </section>
      <section class="card" id="card"></section>
      <section class="mastery" id="mastery"></section>
      <div class="credits">
        <span>Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> (ODbL) · <span id="osm-date"></span></span>
        <button id="reset" type="button">Reset progress</button>
      </div>
    </div>
    <div class="mapwrap">
      <canvas id="map" aria-label="Map of Lyon"></canvas>
      <div class="tip" id="tip" hidden></div>
      <div class="legend"><span><i style="background:var(--rhone)"></i>Rhône</span><span><i style="background:var(--saone)"></i>Saône</span><span><i style="background:none;border-top:2px dotted var(--street-ped);height:0"></i>Pedestrian</span></div>
      <div class="mapbtns">
        <button type="button" id="z-in" aria-label="Zoom in">+</button>
        <button type="button" id="z-out" aria-label="Zoom out">−</button>
        <button type="button" id="z-fit" aria-label="Show whole area">⤢</button>
      </div>
    </div>
  </main>
</div></div>

<script type="application/json" id="lyon-data">__DATA__</script>
<script>
(() => {
"use strict";
const RAW = JSON.parse(document.getElementById("lyon-data").textContent);

/* ---------- data ---------- */
function dec(flat) {
  const a = new Float32Array(flat.length);
  let x = 0, y = 0;
  for (let i = 0; i < flat.length; i += 2) { x += flat[i]; y += flat[i + 1]; a[i] = x; a[i + 1] = y; }
  return a;
}
function bboxOf(arrs) {
  const b = [Infinity, Infinity, -Infinity, -Infinity];
  for (const a of arrs) for (let i = 0; i < a.length; i += 2) {
    if (a[i] < b[0]) b[0] = a[i]; if (a[i + 1] < b[1]) b[1] = a[i + 1];
    if (a[i] > b[2]) b[2] = a[i]; if (a[i + 1] > b[3]) b[3] = a[i + 1];
  }
  return b;
}
const ARR = {};
for (const [n, rings] of Object.entries(RAW.arr)) {
  const r = rings.map(dec);
  // label point: area-weighted centroid of the ring
  let A = 0, cx = 0, cy = 0; const p = r[0];
  for (let i = 0; i < p.length - 2; i += 2) {
    const f = p[i] * p[i + 3] - p[i + 2] * p[i + 1];
    A += f; cx += (p[i] + p[i + 2]) * f; cy += (p[i + 1] + p[i + 3]) * f;
  }
  ARR[n] = { n: +n, rings: r, bbox: bboxOf(r), label: [cx / (3 * A), cy / (3 * A)] };
}
const RIVERS = { rhone: RAW.rivers.rhone.map(dec), saone: RAW.rivers.saone.map(dec) };
const CITY_BBOX = bboxOf(Object.values(ARR).flatMap(a => a.rings));
const level = (rank, len) => (rank <= 1 || len >= 900) ? 1 : (rank <= 2 || len >= 350) ? 2 : 3;
const STREETS = RAW.streets.map(([name, rank, mask, len, lines], id) => {
  const L = lines.map(dec);
  let sx = 0, sy = 0, n = 0;
  for (const a of L) for (let i = 0; i < a.length; i += 2) { sx += a[i]; sy += a[i + 1]; n++; }
  const arrs = []; for (let k = 1; k <= 9; k++) if (mask >> k & 1) arrs.push(k);
  return { id, name, rank, mask, len, lines: L, bbox: bboxOf(L), c: [sx / n, sy / n], level: level(rank, len), arrs };
});
const BY_NAME = new Map(STREETS.map(s => [s.name, s]));
document.getElementById("brand-count").textContent = `${STREETS.length.toLocaleString("en-GB")} streets · 9 arr.`;
document.getElementById("osm-date").textContent = new Date(RAW.osm).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });

const arrName = n => n == 1 ? "1<sup>er</sup>" : n + "<sup>e</sup>";
const arrText = n => n == 1 ? "1er" : n + "e";
const TYPE = ["Main road", "Major street", "Through street", "Local street", "Pedestrian way"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDist = m => m < 1000 ? Math.round(m / 5) * 5 + " m" : (m / 1000).toFixed(1) + " km";

/* ---------- geometry ---------- */
function pip(x, y, rings) {
  let inside = false;
  for (const r of rings) for (let i = 0, j = r.length - 2; i < r.length; j = i, i += 2) {
    const xi = r[i], yi = r[i + 1], xj = r[j], yj = r[j + 1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

  return (s.__opts = shuffle([s, ...near]));
}
function showNameQuestion() {
  const s = current(); if (!s) return;
  overlay = { target: s };
  animateTo(fitView(s.bbox, 40, 1100));
}
function answerName(opt) {
  const r = state.round, s = current();
  if (r.answer || !r.started) return;
  const base = opt === s ? 100 : 0, tt = elapsed(), sc = withSpeed(base, tt);
  r.answer = { t: tt, pick: opt, base, score: sc }; r.scores.push(sc); record(s.name, sc);
  overlay = { target: s, wrong: opt === s ? null : opt };
  if (opt !== s) { const b = s.bbox.slice(), o = opt.bbox; b[0] = Math.min(b[0], o[0]); b[1] = Math.min(b[1], o[1]); b[2] = Math.max(b[2], o[2]); b[3] = Math.max(b[3], o[3]); animateTo(fitView(b, 40, 1100)); }
  else draw();
  render();
}
function next() {
  const r = state.round; if (!r) return;
  r.i++; r.answer = null; r.pending = null; overlay = {}; hover = null;
  if (r.i < r.items.length) {
    if (state.mode === "name") showNameQuestion();
    else animateTo(fitView(areaBBox(), 24));
  } else animateTo(fitView(areaBBox(), 24));
  startClock();
  render(); draw();
}

/* ---------- panel ---------- */
const card = document.getElementById("card");
const mastery = document.getElementById("mastery");
const settings = document.getElementById("settings");
const fArr = document.getElementById("f-arr"), fLevel = document.getElementById("f-level"), timerbar = document.getElementById("timerbar");
fArr.innerHTML = `<option value="0">All of Lyon</option>` + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<option value="${n}">${arrText(n)} arrondissement</option>`).join("");
function updateLevelLabels() {
  const inArea = s => !state.arr || (s.mask >> state.arr & 1);
  const c = [1, 2, 3].map(l => STREETS.filter(s => s.level <= l && inArea(s)).length);
  const names = ["Main roads", "+ Well-known streets", "Every street"];
  [...fLevel.options].forEach((o, i) => o.textContent = `${names[i]} (${c[i]})`);
}

function render() {
  document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-selected", b.dataset.mode === state.mode));
  fArr.value = state.arr; fLevel.value = state.level; updateLevelLabels();
  settings.hidden = state.mode === "district";
  fLevel.parentElement.hidden = state.mode === "explore";
  timerbar.hidden = state.mode === "explore";
  timerbar.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.t === state.timer));
  canvas.classList.toggle("pan", state.mode === "name");
  const r = state.round;

  if (state.mode === "explore") { renderExplore(); renderMastery(); return; }
  if (!r || !r.items.length) { card.innerHTML = `<p class="hint">No streets match this selection. Try a wider level.</p>`; mastery.innerHTML = ""; return; }

  if (r.i >= r.items.length) { renderSummary(); renderMastery(); return; }
  const it = current(), num = `${r.i + 1} / ${r.items.length}`;
  const total = r.scores.reduce((a, b) => a + b, 0);
  const eyebrow = (label) => `<div class="eyebrow"><span>${label}</span><span>${num} · ${total} pts</span></div>` + clockHtml();
  const timeNote = a => !timedMode() || !a.base ? "" : a.score < a.base ? ` · −${a.base - a.score} for time` : a.t <= 3 ? " · full points for speed" : "";

  if (!r.started) {
    const what = state.mode === "district" ? "9 districts" : `${r.items.length} streets`;
    card.innerHTML = eyebrow("Ready") + `<div class="plaque"><div>${what} · ${state.timer} s each</div></div>
      <p class="hint">The clock starts when you press Start. After each answer, Next starts the following question straight away.</p>
      <div class="tiers"><span><em>&lt; 3 s</em>Full points</span><span><em>Slower</em>Down to 70%</span><span><em>Wrong</em>No bonus</span><span><em>Buzzer</em>0</span></div>
      <div class="row"><button class="btn primary" id="start">Start</button></div>`;
    const st = document.getElementById("start"); st.onclick = startRound; st.focus({ preventScroll: true });
    renderMastery(); return;
  }

  if (state.mode === "find") {
    let h = eyebrow("Find this street") + plaque(it.name);
    if (!r.answer && r.pending) {
      h += `<p class="hint">Highlighted street selected. Tap it again or confirm. Tap elsewhere to pick another.</p><div class="row"><button class="btn primary" id="confirm">Confirm</button><button class="btn" id="cancel">Cancel</button></div>`;
    } else if (!r.answer) {
      h += `<p class="hint">Point at a street to highlight it, then click it to answer. On a phone, tap once to highlight and again to answer.</p>`;
      h += `<div class="tiers">${TIERS.map(([p, l]) => `<span><em>${p}</em>${l}</span>`).join("")}</div>`;
      h += `<div class="row"><button class="btn link" id="skip">I don't know, show me</button></div>`;
    } else {
      const a = r.answer;
      const msg = !a.pick ? (a.timeout ? "Time's up. Here it is." : "Here it is.") : a.base === 100 ? "Right street." :
        `You picked ${esc(a.pick.name)}, ${a.d < 15 ? "which touches it" : fmtDist(a.d) + " away"}.`;
      const why = !a.pick || a.base === 100 ? "" : a.base === 50 ? "Close: within 250 m. " : a.base === 20 ? "Right arrondissement. " : "";
      h += `<div class="result"><div class="score ${scoreClass(a.score)}">${a.score}</div><p><strong>${msg}</strong><br><span class="hint">${why}${TYPE[it.rank]} · ${it.arrs.map(arrName).join(", ")} arr. · ${fmtDist(it.len)} long${a.pick && a.base < 100 ? " · your pick in amber" : ""}${timeNote(a)}</span></p></div>`;
      h += `<div class="row"><button class="btn primary" id="next">${r.i + 1 < r.items.length ? "Next street" : "See results"}</button></div>`;
    }
    card.innerHTML = h;
    const cf = document.getElementById("confirm"); if (cf) cf.onclick = () => answerFind(r.pending);
    const cc = document.getElementById("cancel"); if (cc) cc.onclick = () => { r.pending = null; render(); draw(); };
  } else if (state.mode === "name") {
    const opts = nameOptions(it), a = r.answer;
    let h = eyebrow("Name the red street") + `<div class="options">` + opts.map((o, i) => {
      let cls = ""; if (a) { if (o === it) cls = "good"; else if (o === a.pick) cls = "bad"; }
      return `<button data-i="${i}" class="${cls}" ${a ? "disabled" : ""}><b>${i + 1}</b>${esc(o.name)}</button>`;
    }).join("") + `</div>`;
    if (a) {
      h += `<p class="hint">${a.base ? `Correct: ${a.score} pts${timeNote(a)}.` : a.pick ? `It's <strong>${esc(it.name)}</strong>. Your pick, ${esc(a.pick.name)}, is shown in amber.` : `Time's up. It's <strong>${esc(it.name)}</strong>.`} ${it.arrs.map(arrName).join(", ")} arr.</p>`;
      h += `<div class="row"><button class="btn primary" id="next">${r.i + 1 < r.items.length ? "Next street" : "See results"}</button></div>`;
    }
    card.innerHTML = h;
    card.querySelectorAll(".options button").forEach(b => b.onclick = () => answerName(opts[+b.dataset.i]));
  } else if (state.mode === "district") {
    let h = eyebrow("Tap the district") + plaque(`${arrName(it)} arrondissement`, true);
    if (!r.answer) h += `<p class="hint">Labels are hidden. Tap inside the district.</p>`;
    else {
      const a = r.answer;
      h += `<div class="result"><div class="score ${scoreClass(a.score)}">${a.score}</div><p><strong>${a.base ? "Correct." : a.timeout ? "Time's up." : `That was the ${arrName(a.got)}.`}</strong>${a.base ? `<br><span class="hint">${timeNote(a).replace(" · ", "") || "&nbsp;"}</span>` : `<br><span class="hint">The ${arrName(it)} is shaded green.</span>`}</p></div>`;
      h += `<div class="row"><button class="btn primary" id="next">${r.i + 1 < r.items.length ? "Next district" : "See results"}</button></div>`;
    }
    card.innerHTML = h;
  }
  const n = document.getElementById("next"); if (n) { n.onclick = next; n.focus({ preventScroll: true }); }
  const sk = document.getElementById("skip"); if (sk) sk.onclick = showSkip;
  renderMastery();
}
function plaque(text, html) {
  return `<div class="plaque"><div>${html ? text : esc(text)}</div></div>`;
}
function renderSummary() {
  const r = state.round, max = r.items.length * 100, tot = r.scores.reduce((a, b) => a + b, 0);
  const isArr = state.mode === "district";
  const missed = r.items.map((it, i) => ({ it, sc: r.scores[i] })).filter(m => m.sc < 70);
  let h = `<div class="eyebrow"><span>Round complete${timedMode() ? ` · ${state.timer} s timer` : ""}</span><span>${tot} / ${max}</span></div>`;
  h += `<div class="result"><div class="score ${scoreClass(tot / r.items.length)}">${Math.round(tot / r.items.length)}</div><p><strong>${missed.length ? `${missed.length} to review` : "Nothing to review. Well done."}</strong><br><span class="hint">Average score per question.</span></p></div>`;
  if (missed.length && !isArr) {
    h += `<p class="hint">Tap one to see it on the map. Missed streets come up more often in later rounds.</p><ul class="review">` +
      missed.map((m, i) => `<li><button data-i="${i}"><span>${esc(m.it.name)}</span><span>${m.sc}</span></button></li>`).join("") + `</ul>`;
  }
  if (missed.length && isArr) h += `<p class="hint">Missed: ${missed.map(m => arrName(m.it)).join(", ")}.</p>`;
  h += `<div class="row"><button class="btn primary" id="again">Play another round</button></div>`;
  card.innerHTML = h;
  card.querySelectorAll(".review button").forEach(b => b.onclick = () => {
    const s = missed[+b.dataset.i].it; overlay = { target: s }; animateTo(fitView(s.bbox, 50, 800));
  });
  document.getElementById("again").onclick = newRound;
}
function renderMastery() {
  if (state.mode === "district") {
    const known = [1, 2, 3, 4, 5, 6, 7, 8, 9].filter(n => (stats["arr:" + n]?.last ?? 0) >= 70).length;
    mastery.innerHTML = `<span>You know ${known} of 9 arrondissements</span><div class="bar"><i style="width:${known / 9 * 100}%"></i></div>`;
    return;
  }
  const p = state.mode === "explore" ? STREETS.filter(s => !state.arr || (s.mask >> state.arr & 1)) : pool();
  const known = p.filter(s => (stats[s.name]?.last ?? 0) >= 70).length;
  const where = state.arr ? `in the ${arrName(state.arr)}` : "in Lyon";
  mastery.innerHTML = `<span>You know ${known} of ${p.length} streets ${where} at this level</span><div class="bar"><i style="width:${p.length ? known / p.length * 100 : 0}%"></i></div>`;
}
function renderExplore() {
  const s = state.explore;
  let h = `<div class="eyebrow"><span>Explore</span><span>${STREETS.length} streets</span></div>`;
  h += `<label for="q" class="hint">Search a street, or tap one on the map.</label><input type="search" id="q" list="names" placeholder="e.g. Rue Mercière" autocomplete="off">`;
  if (s) {
    const st = stats[s.name];
    h += plaque(s.name) + `<div class="info"><dl><dt>Type</dt><dd>${TYPE[s.rank]}</dd><dt>District</dt><dd>${s.arrs.map(arrName).join(", ")} arrondissement</dd><dt>Length</dt><dd>${fmtDist(s.len)}</dd><dt>Your last score</dt><dd>${st ? st.last : "Not quizzed yet"}</dd></dl></div>`;
  } else h += `<p class="hint">Use this mode to study an area before quizzing yourself on it. Pick an area above to fade out the rest of the city.</p>`;
  card.innerHTML = h;
  const q = document.getElementById("q");
  const go = () => {
    const v = q.value.trim().toLowerCase(); if (!v) return;
    const hit = BY_NAME.get(q.value.trim()) || STREETS.find(x => x.name.toLowerCase() === v) || STREETS.find(x => x.name.toLowerCase().includes(v));
    if (hit) { state.explore = hit; overlay = { select: hit }; animateTo(fitView(hit.bbox, 50, 700)); render(); }
  };
  q.addEventListener("change", go);
  q.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}
const dl = document.createElement("datalist"); dl.id = "names";
dl.innerHTML = STREETS.map(s => `<option value="${esc(s.name)}">`).join(""); document.body.appendChild(dl);

/* ---------- controls ---------- */
document.querySelectorAll(".modes button").forEach(b => b.onclick = () => {
  state.mode = b.dataset.mode; state.explore = null; savePrefs(); newRound();
});
fArr.onchange = () => { state.arr = +fArr.value; savePrefs(); if (state.mode === "explore") { animateTo(fitView(areaBBox(), 24)); render(); draw(); } else newRound(); };
fLevel.onchange = () => { state.level = +fLevel.value; savePrefs(); newRound(); };
timerbar.querySelectorAll("button").forEach(b => b.onclick = () => { state.timer = +b.dataset.t; savePrefs(); newRound(); });
const reset = document.getElementById("reset");
reset.onclick = () => {
  if (reset.dataset.armed) { stats = {}; saveStats(); reset.textContent = "Progress cleared"; delete reset.dataset.armed; render(); setTimeout(() => reset.textContent = "Reset progress", 2000); }
  else { reset.dataset.armed = "1"; reset.textContent = "Tap again to clear all progress"; setTimeout(() => { if (reset.dataset.armed) { delete reset.dataset.armed; reset.textContent = "Reset progress"; } }, 4000); }
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const r = state.round;
  if (state.mode === "name" && r && !r.answer && current() && /^[1-4]$/.test(e.key)) { const o = nameOptions(current())[+e.key - 1]; if (o) answerName(o); }
});

newRound();
})();
</script>
</body>
